- insert:
    - id: suggest-prompt
      name: '@studyzy/dsh-suggest-prompt'
      config:
        maxInputBytes: 24576
        maxOutputTokens: 512
        timeoutMs: 30000
        maxRecentTurns: 2
        maxTranscriptChars: 6000
        maxSuggestionChars: 120
        acceptKey: Tab
        provider: ollama-cloud
        model: deepseek-v4.1-flash
