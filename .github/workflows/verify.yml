name: Verify classroom pack
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: bash -n scripts/bootstrap.sh
      - name: Check Python source syntax
        run: python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('.').rglob('*.py')]"
      - name: Test synthetic portable file and chat parsers
        run: python3 -B tests/parsers.py
